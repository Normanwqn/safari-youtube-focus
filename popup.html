<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root { color-scheme: light dark; }
      body {
        font: 14px -apple-system, system-ui, sans-serif;
        width: 260px;
        margin: 0;
        padding: 14px 16px;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 12px;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 0;
        /* rgba fallback first: color-mix needs Safari 16.2+, floor is 16.0 */
        border-top: 1px solid rgba(128, 128, 128, 0.25);
        border-top: 1px solid color-mix(in srgb, currentColor 12%, transparent);
      }
      .row:first-of-type { border-top: none; }
      .row.locked label { cursor: default; opacity: 0.7; }
      .always {
        font-size: 11px;
        padding: 2px 8px;
        border-radius: 10px;
        background: rgba(128, 128, 128, 0.15);
        background: color-mix(in srgb, currentColor 10%, transparent);
        opacity: 0.7;
      }
      label { cursor: pointer; }
      input[type="checkbox"] {
        width: 18px;
        height: 18px;
        cursor: pointer;
      }
      .hint {
        margin-top: 12px;
        font-size: 11px;
        opacity: 0.6;
      }
    </style>
  </head>
  <body>
    <h1>TubeFocus</h1>

    <div class="row locked">
      <label data-i18n="homeFeed">Home feed</label>
      <span class="always" data-i18n="alwaysHidden">Always hidden</span>
    </div>
    <div class="row">
      <label for="hideRelated" data-i18n="hideRelated">Hide related / end-screen</label>
      <input type="checkbox" id="hideRelated" />
    </div>
    <div class="row">
      <label for="hideShorts" data-i18n="hideShorts">Hide Shorts</label>
      <input type="checkbox" id="hideShorts" />
    </div>
    <div class="row">
      <label for="hideComments" data-i18n="hideComments">Hide comments</label>
      <input type="checkbox" id="hideComments" />
    </div>
    <div class="row">
      <label for="hideSubscriptions" data-i18n="hideSubscriptions">Hide subscriptions</label>
      <input type="checkbox" id="hideSubscriptions" />
    </div>
    <div class="row">
      <label for="hideEntertainment" data-i18n="hideEntertainment">Hide entertainment videos</label>
      <input type="checkbox" id="hideEntertainment" />
    </div>
    <div class="row">
      <label for="blockAutoplay" data-i18n="blockAutoplay">Block autoplay</label>
      <input type="checkbox" id="blockAutoplay" />
    </div>

    <p class="hint" data-i18n="hint">Changes apply instantly to open YouTube tabs. Settings are stored on this device.</p>

    <script src="popup.js"></script>
  </body>
</html>
