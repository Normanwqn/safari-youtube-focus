<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- macOS app-icon artwork, per actual Liquid Glass principles: FLAT layers
       with clearly defined edges and NO baked effects (no glints, glows,
       rims, shadows) — the system supplies dynamic specular/refraction/
       translucency itself. Composition: hourglass centered (x=512) per the
       HIG's "keep primary content centered"; play badge tucked into its
       lower-right shoulder at (690,688), r = 160/phi. Full-bleed square;
       system applies the mask.
       Original illustration — not the trademarked YouTube logo. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3E3E46"/>
      <stop offset="1" stop-color="#1E1E23"/>
    </linearGradient>
    <clipPath id="glassClip">
      <path d="M277 238 C277 354 322 430 399 494 C402 497 402 523 399 526 C322 590 277 666 277 782 L563 782 C563 666 518 590 441 526 C438 523 438 497 441 494 C518 430 563 354 563 238 Z"/>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" fill="url(#bg)"/>

  <!-- hourglass, centered (local 420 -> 512) -->
  <g transform="translate(92,0)">
    <!-- glass: one flat translucent shape, one clean outline -->
    <path d="M277 238 C277 354 322 430 399 494 C402 497 402 523 399 526 C322 590 277 666 277 782 L563 782 C563 666 518 590 441 526 C438 523 438 497 441 494 C518 430 563 354 563 238 Z"
          fill="#FFFFFF" fill-opacity="0.22"/>

    <!-- sand: flat single red, clipped to the glass -->
    <g clip-path="url(#glassClip)">
      <path d="M336 470 C372 448 398 442 412 450 C417 454 423 454 428 450 C442 442 468 448 504 470 L504 516 L336 516 Z" fill="#DC3A30"/>
      <rect x="411" y="502" width="18" height="188" rx="9" fill="#DC3A30"/>
      <path d="M284 788 C322 700 372 650 414 638 C418 636.5 422 636.5 426 638 C468 650 518 700 556 788 Z" fill="#DC3A30"/>
    </g>

    <path d="M277 238 C277 354 322 430 399 494 C402 497 402 523 399 526 C322 590 277 666 277 782 L563 782 C563 666 518 590 441 526 C438 523 438 497 441 494 C518 430 563 354 563 238 Z"
          fill="none" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="14" stroke-linejoin="round"/>

    <!-- caps: flat light gray, no highlight bands -->
    <rect x="256" y="180" width="328" height="64" rx="30" fill="#E2E2E7"/>
    <rect x="256" y="776" width="328" height="64" rx="30" fill="#E2E2E7"/>
  </g>

  <!-- play badge: flat red circle + flat white triangle, no ring, no glint -->
  <circle cx="690" cy="688" r="100" fill="#DC3A30"/>
  <path d="M745 688 L667 643 L667 733 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="24" stroke-linejoin="round"/>
</svg>
