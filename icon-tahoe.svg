<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- macOS 26 (Tahoe) app-icon artwork: FULL-BLEED SQUARE, per the current
       HIG. No rounded corners, no margin, no baked shadow — the system applies
       the standard squircle mask and Liquid Glass lighting itself.
       Same original hourglass/play-sand design as icon.svg (not the YouTube logo). -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E4342C"/>
      <stop offset="1" stop-color="#A81810"/>
    </linearGradient>
  </defs>

  <!-- edge-to-edge background; corners get cropped by the system mask -->
  <rect x="0" y="0" width="1024" height="1024" fill="url(#tile)"/>

  <g fill="#FFFFFF">
    <!-- hourglass frame bars -->
    <rect x="312" y="196" width="400" height="46" rx="23"/>
    <rect x="312" y="782" width="400" height="46" rx="23"/>
    <!-- top bulb (sand draining) -->
    <path d="M352,258 L672,258 L512,500 Z"/>
    <!-- bottom bulb (sand pile) -->
    <path d="M352,766 L672,766 L512,524 Z"/>
  </g>

  <!-- play-button cutout in the fallen sand -->
  <path d="M468,622 L468,714 L560,668 Z" fill="#B7201A"/>

  <!-- falling sand stream -->
  <rect x="504" y="470" width="16" height="88" rx="8" fill="#FFFFFF"/>
</svg>
