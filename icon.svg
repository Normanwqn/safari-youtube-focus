<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- YouTube Focus web-extension icon (Safari toolbar / Extensions pane).
       Same glyph as icon-tahoe.svg for cross-context consistency; this variant
       bakes the rounded tile because web-extension icons get no system mask.
       Original design — deliberately NOT the (trademarked) YouTube logo. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E4342C"/>
      <stop offset="1" stop-color="#A81810"/>
    </linearGradient>
  </defs>

  <!-- rounded tile (baked: no system masking in web-extension contexts) -->
  <rect x="0" y="0" width="1024" height="1024" rx="224" fill="url(#tile)"/>

  <!-- hourglass: bars + two funnels flowing into a central circular hub -->
  <g fill="#FFFFFF" stroke="#FFFFFF" stroke-width="20" stroke-linejoin="round">
    <rect x="312" y="196" width="400" height="46" rx="23" stroke="none"/>
    <rect x="312" y="782" width="400" height="46" rx="23" stroke="none"/>
    <path d="M362,268 L662,268 L512,460 Z"/>
    <path d="M362,756 L662,756 L512,564 Z"/>
    <circle cx="512" cy="512" r="150" stroke="none"/>
  </g>

  <!-- play button, optically centered on the canvas center (512,512) -->
  <path d="M475,447 L475,577 L585,512 Z"
        fill="#B7201A" stroke="#B7201A" stroke-width="16" stroke-linejoin="round"/>
</svg>
