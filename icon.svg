<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- YouTube Focus web-extension icon (Safari toolbar / Extensions pane).
       Same artwork as icon-tahoe.svg, clipped to a rounded tile because
       web-extension icons get no system mask.
       Original illustration — not the trademarked YouTube logo. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6F6F8"/>
      <stop offset="1" stop-color="#D9D9DE"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4E4E55"/>
      <stop offset="1" stop-color="#2F2F34"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#DCE9F4" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#BFD4E6" stop-opacity="0.38"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="430" x2="0" y2="790" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E2453A"/>
      <stop offset="1" stop-color="#C92C24"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E2453A"/>
      <stop offset="1" stop-color="#C7271E"/>
    </linearGradient>
    <clipPath id="glassClip">
      <path d="M277 238 C277 354 322 430 399 494 C402 497 402 523 399 526 C322 590 277 666 277 782 L563 782 C563 666 518 590 441 526 C438 523 438 497 441 494 C518 430 563 354 563 238 Z"/>
    </clipPath>
    <clipPath id="tileClip">
      <rect x="0" y="0" width="1024" height="1024" rx="224"/>
    </clipPath>
  </defs>

  <g clip-path="url(#tileClip)">
    <rect x="0" y="0" width="1024" height="1024" fill="url(#bg)"/>

    <path d="M277 238 C277 354 322 430 399 494 C402 497 402 523 399 526 C322 590 277 666 277 782 L563 782 C563 666 518 590 441 526 C438 523 438 497 441 494 C518 430 563 354 563 238 Z" fill="url(#glass)"/>

    <g clip-path="url(#glassClip)">
      <path d="M336 470 C372 448 398 442 412 450 C417 454 423 454 428 450 C442 442 468 448 504 470 L504 516 L336 516 Z" fill="url(#sand)"/>
      <rect x="411" y="502" width="18" height="188" rx="9" fill="url(#sand)"/>
      <path d="M284 788 C322 700 372 650 414 638 C418 636.5 422 636.5 426 638 C468 650 518 700 556 788 Z" fill="url(#sand)"/>
    </g>

    <path d="M277 238 C277 354 322 430 399 494 C402 497 402 523 399 526 C322 590 277 666 277 782 L563 782 C563 666 518 590 441 526 C438 523 438 497 441 494 C518 430 563 354 563 238 Z" fill="none" stroke="#F4F9FD" stroke-opacity="0.85" stroke-width="14" stroke-linejoin="round"/>

    <path d="M320 296 C308 344 313 390 338 428" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="22" stroke-linecap="round"/>
    <path d="M314 706 C309 734 317 752 334 764" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="20" stroke-linecap="round"/>

    <rect x="256" y="180" width="328" height="64" rx="30" fill="url(#cap)"/>
    <rect x="272" y="191" width="296" height="15" rx="7.5" fill="#6C6C74" opacity="0.9"/>
    <rect x="256" y="776" width="328" height="64" rx="30" fill="url(#cap)"/>
    <rect x="272" y="787" width="296" height="15" rx="7.5" fill="#6C6C74" opacity="0.9"/>

    <circle cx="700" cy="560" r="160" fill="url(#badge)"/>
    <path d="M790 560 L655 482 L655 638 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="40" stroke-linejoin="round"/>
  </g>
</svg>
